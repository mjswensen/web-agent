name: Release standalone binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build runtime and standalone binaries
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -eu
            mise install
            bun install --frozen-lockfile
            bun run build
            mkdir -p dist
            bun -p 'require("./package.json").version' > dist/package-version
            bun build ./build/server-runtime/server/entry.js --compile --minify --bytecode --target=bun-linux-x64 --outfile=dist/web-agent-linux-x64
            bun build ./build/server-runtime/server/entry.js --compile --minify --bytecode --target=bun-linux-arm64 --outfile=dist/web-agent-linux-arm64
            bun build ./build/server-runtime/server/entry.js --compile --minify --bytecode --target=bun-darwin-x64 --outfile=dist/web-agent-darwin-x64
            bun build ./build/server-runtime/server/entry.js --compile --minify --bytecode --target=bun-darwin-arm64 --outfile=dist/web-agent-darwin-arm64
            bun build ./build/server-runtime/server/entry.js --compile --minify --bytecode --target=bun-windows-x64 --outfile=dist/web-agent-windows-x64.exe
            cp ./install.sh ./dist/install.sh

      - name: Read package version
        id: package_version
        run: echo "version=$(cat dist/package-version)" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: v${{ steps.package_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Standalone binaries for Web Agent version `${{ steps.package_version.outputs.version }}`.
          files: |
            dist/web-agent-linux-x64
            dist/web-agent-linux-arm64
            dist/web-agent-darwin-x64
            dist/web-agent-darwin-arm64
            dist/web-agent-windows-x64.exe
            dist/install.sh
